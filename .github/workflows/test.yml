name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: hook smoke test
        shell: bash
        run: |
          out=$(echo '{"session_id":"ci","last_assistant_message":"Plan ready. Shall I continue?","stop_hook_active":false}' \
            | ADACTUS_HOME="$RUNNER_TEMP/adactus" node hooks/stop.js)
          echo "$out"
          echo "$out" | grep -q '"decision":"block"'
