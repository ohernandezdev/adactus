name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: hook without a backend fails visibly and never blocks
        shell: bash
        run: |
          set +e
          out=$(echo '{"session_id":"ci","last_assistant_message":"Plan ready. Shall I continue?","stop_hook_active":false}' \
            | ADACTUS_HOME="$RUNNER_TEMP/adactus" node hooks/stop.js 2>err.txt)
          code=$?
          cat err.txt
          test "$code" = 1 && test -z "$out" && grep -q "no System One backend configured" err.txt
